name: CI

on:
  push:
    branches: [master, "agent/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  POSTGRES_VERSION: 17.11-1
  POSTGRES_URL: https://get.enterprisedb.com/postgresql/postgresql-17.11-1-windows-x64-binaries.zip
  POSTGRES_SHA256: 6eabdf00d2893713b75db4336a23c3fdf505f056e217ec6e2e95d901750cfea3

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore FarmaFlow.Agent.sln
      - name: Build
        run: dotnet build FarmaFlow.Agent.sln -c Release --no-restore
      - name: Test
        run: dotnet test FarmaFlow.Agent.sln -c Release --no-build
      - name: Publish win-x64
        run: dotnet publish src/FarmaFlow.Agent/FarmaFlow.Agent.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Publish server host win-x64
        run: dotnet publish src/FarmaFlow.Server.Host/FarmaFlow.Server.Host.csproj -c Release -r win-x64 --self-contained true -o publish-server-host
      - name: Explain runtime artifacts
        shell: pwsh
        run: |
          @"
          FarmaFlow — artefacto de validação da CI

          FarmaFlowAgent.exe é o agente de tray da estação; ele fica na bandeja
          do Windows e não abre uma janela principal ao ser executado.
          Para uso normal, baixe o instalador FarmaFlow-Estacao-Setup.exe da
          release ou do artifact FarmaFlow-Windows-<versão>.
          "@ | Set-Content publish\LEIA-ME.txt -Encoding UTF8
          @"
          FarmaFlow — artefacto de validação da CI

          FarmaFlowServerHost.exe é um serviço/supervisor e não é um instalador.
          Ele depende de PostgreSQL, Java, Node, backend e frontend preparados
          no mesmo diretório. Para uso normal, baixe FarmaFlow-Server-Setup.exe
          da release ou do artifact FarmaFlow-Windows-<versão>.
          "@ | Set-Content publish-server-host\LEIA-ME.txt -Encoding UTF8
      - name: Publish migration tool win-x64
        run: dotnet publish src/FarmaFlow.Migration/FarmaFlow.Migration.csproj -c Release -r win-x64 --self-contained true -o publish-migration
      - name: Publish migration assistant win-x64
        run: dotnet publish src/FarmaFlow.Migration.Desktop/FarmaFlow.Migration.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish-migration-desktop
      - name: Include PostgreSQL 17 in migration artifact
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "postgresql-$env:POSTGRES_VERSION-windows-x64-binaries.zip"
          Invoke-WebRequest -Uri $env:POSTGRES_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:POSTGRES_SHA256) { throw "SHA-256 do PostgreSQL não confere: $hash" }
          $extract = Join-Path $env:RUNNER_TEMP "farmaflow-postgres"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem $extract -Directory | Select-Object -First 1
          if ($null -eq $root -or -not (Test-Path (Join-Path $root.FullName "bin\pg_restore.exe"))) {
            throw "O ZIP do PostgreSQL não contém bin\pg_restore.exe."
          }
          New-Item -ItemType Directory -Force -Path publish-migration\postgres | Out-Null
          Copy-Item (Join-Path $root.FullName "*") publish-migration\postgres -Recurse -Force
          if (-not (Test-Path publish-migration\postgres\bin\initdb.exe)) { throw "initdb.exe não foi incluído no artifact." }
      - name: Explain migration artifact
        shell: pwsh
        run: |
          Copy-Item publish-migration-desktop\FarmaFlowMigracaoSetup.exe publish-migration\FarmaFlowMigracaoSetup.exe -Force
          @"
          FarmaFlow — artefacto de validação da CI

          Para abrir uma janela, execute FarmaFlowMigracaoSetup.exe.
          FarmaFlow.Migration.exe é apenas a ferramenta CLI de contingência;
          ao clicar duas vezes, o console pode fechar imediatamente depois do help.

          Este artifact inclui PostgreSQL 17 portátil para o ensaio. O instalador
          completo também é publicado na release como FarmaFlow-Migracao-Setup.exe
          e no artifact FarmaFlow-Windows-<versão>.
          "@ | Set-Content publish-migration\LEIA-ME.txt -Encoding UTF8
      - name: Smoke test portable PostgreSQL
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\publish-migration\FarmaFlowMigracaoSetup.exe `
            -ArgumentList "--smoke-test-postgres" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "O PostgreSQL portátil não conseguiu inicializar, iniciar e limpar um cluster temporário." }
      - name: End-to-end migration flow
        shell: pwsh
        run: .\scripts\Test-MigrationFlow.ps1 -PostgresBin .\publish-migration\postgres\bin -MigrationExecutable .\publish-migration\FarmaFlow.Migration.exe
      - name: Verify native PDF printing library
        shell: pwsh
        run: |
          $pdfium = "publish\runtimes\win-x64\native\pdfium.dll"
          if (-not (Test-Path $pdfium)) { throw "Missing native PDFium library: $pdfium" }
      - name: Smoke test published executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\publish\FarmaFlowAgent.exe `
            -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Smoke test da estação falhou." }
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaFlow-Estacao-win-x64
          path: publish/
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaFlow-Server-Host-win-x64
          path: publish-server-host/
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaFlow-Migration-win-x64
          path: publish-migration/
