name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: src/FarmaFlow.Agent/FarmaFlow.Agent.csproj
      - name: Restore
        run: dotnet restore FarmaFlow.Agent.sln
      - name: Build
        run: dotnet build FarmaFlow.Agent.sln -c Release --no-restore
      - name: Test
        run: dotnet test FarmaFlow.Agent.sln -c Release --no-build
      - name: Publish win-x64
        run: dotnet publish src/FarmaFlow.Agent/FarmaFlow.Agent.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Verify native PDF printing library
        shell: pwsh
        run: |
          $pdfium = "publish\runtimes\win-x64\native\pdfium.dll"
          if (-not (Test-Path $pdfium)) { throw "Missing native PDFium library: $pdfium" }
      - name: Smoke test published executable
        run: .\publish\FarmaFlowAgent.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaFlowAgent-win-x64
          path: publish/
