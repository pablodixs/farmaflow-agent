name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore FarmaFlow.Agent.sln
      - name: Build
        run: dotnet build FarmaFlow.Agent.sln -c Release --no-restore
      - name: Test
        run: dotnet test FarmaFlow.Agent.sln -c Release --no-build
      - name: Publish win-x64
        run: dotnet publish src/FarmaFlow.Agent/FarmaFlow.Agent.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Publish server host win-x64
        run: dotnet publish src/FarmaFlow.Server.Host/FarmaFlow.Server.Host.csproj -c Release -r win-x64 --self-contained true -o publish-server-host
      - name: Publish migration tool win-x64
        run: dotnet publish src/FarmaFlow.Migration/FarmaFlow.Migration.csproj -c Release -r win-x64 --self-contained true -o publish-migration
      - name: Verify native PDF printing library
        shell: pwsh
        run: |
          $pdfium = "publish\runtimes\win-x64\native\pdfium.dll"
          if (-not (Test-Path $pdfium)) { throw "Missing native PDFium library: $pdfium" }
      - name: Smoke test published executable
        run: .\publish\FarmaFlowAgent.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaFlow-Estacao-win-x64
          path: publish/
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaFlow-Server-Host-win-x64
          path: publish-server-host/
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaFlow-Migration-win-x64
          path: publish-migration/
