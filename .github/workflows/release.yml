name: Build Windows installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Versão sem o prefixo v
        required: true
        type: string
      backend_ref:
        description: Branch, tag ou commit do backend
        required: false
        default: main
        type: string
      web_ref:
        description: Branch, tag ou commit do frontend
        required: false
        default: main
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  POSTGRES_VERSION: 17.11-1
  POSTGRES_URL: https://get.enterprisedb.com/postgresql/postgresql-17.11-1-windows-x64-binaries.zip
  POSTGRES_SHA256: 6eabdf00d2893713b75db4336a23c3fdf505f056e217ec6e2e95d901750cfea3

jobs:
  build-installers:
    name: Build installers (win-x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout packaging and desktop host
        uses: actions/checkout@v7
        with:
          path: agent
          persist-credentials: false

      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          repository: pablodixs/farmaflow.backend
          ref: ${{ inputs.backend_ref || vars.FARMAFLOW_BACKEND_REF || 'main' }}
          path: backend
          token: ${{ secrets.FARMAFLOW_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout frontend
        uses: actions/checkout@v7
        with:
          repository: pablodixs/farmaflow
          ref: ${{ inputs.web_ref || vars.FARMAFLOW_WEB_REF || 'main' }}
          path: web
          token: ${{ secrets.FARMAFLOW_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Versão inválida: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache PostgreSQL archive
        uses: actions/cache@v4
        with:
          path: agent/.runtime-cache/postgresql-${{ env.POSTGRES_VERSION }}-windows-x64-binaries.zip
          key: postgresql-${{ env.POSTGRES_VERSION }}-windows-x64-${{ env.POSTGRES_SHA256 }}

      - name: Build backend
        shell: pwsh
        run: |
          Push-Location backend
          .\mvnw.cmd -B -DskipTests package
          if ($LASTEXITCODE -ne 0) { throw "Build do backend falhou." }
          Pop-Location

      - name: Build standalone frontend
        shell: pwsh
        env:
          NEXT_PUBLIC_API_URL: /backend
        run: |
          Push-Location web
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "Instalação do frontend falhou." }
          bun run build:standalone
          if ($LASTEXITCODE -ne 0) { throw "Build standalone do frontend falhou." }
          Pop-Location
          if (-not (Test-Path "web\.next\standalone\server.js")) {
            throw "O frontend não produziu .next/standalone/server.js."
          }

      - name: Build and test Windows components
        shell: pwsh
        run: |
          dotnet build agent\FarmaFlow.Agent.sln -c Release -p:Version=${{ steps.version.outputs.value }}
          if ($LASTEXITCODE -ne 0) { throw "Build dos componentes Windows falhou." }
          dotnet test agent\FarmaFlow.Agent.sln -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "Testes dos componentes Windows falharam." }

      - name: Prepare pinned runtimes
        shell: pwsh
        run: |
          $node = (Get-Command node.exe).Source
          & agent\scripts\Prepare-PackagingRuntimes.ps1 `
            -JavaHome $env:JAVA_HOME `
            -NodeExecutable $node `
            -PostgresUrl $env:POSTGRES_URL `
            -PostgresSha256 $env:POSTGRES_SHA256 `
            -OutputDirectory runtime-input `
            -DownloadCacheDirectory agent\.runtime-cache

      - name: Publish station and migration tool
        shell: pwsh
        run: |
          dotnet publish agent\src\FarmaFlow.Agent\FarmaFlow.Agent.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.value }} `
            -o agent\publish
          if ($LASTEXITCODE -ne 0) { throw "Publicação da estação falhou." }

          dotnet publish agent\src\FarmaFlow.Migration\FarmaFlow.Migration.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.value }} `
            -o agent\publish-migration
          if ($LASTEXITCODE -ne 0) { throw "Publicação da ferramenta de migração falhou." }

      - name: Stage server distribution
        shell: pwsh
        run: |
          $jar = Get-ChildItem backend\target\*.jar |
            Where-Object { $_.Name -notlike "*.original" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $jar) { throw "JAR executável do backend não encontrado." }

          & agent\scripts\Stage-ServerPackage.ps1 `
            -BackendJar $jar.FullName `
            -WebStandalone (Resolve-Path web\.next\standalone) `
            -JavaRuntime (Resolve-Path runtime-input\java) `
            -NodeRuntime (Resolve-Path runtime-input\node) `
            -PostgresRuntime (Resolve-Path runtime-input\postgres) `
            -Version "${{ steps.version.outputs.value }}" `
            -OutputDirectory agent\publish-server

      - name: Bundle and verify WebView2 bootstrapper
        shell: pwsh
        run: |
          $bootstrapper = "agent\publish\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper
          $signature = Get-AuthenticodeSignature $bootstrapper
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "Assinatura Authenticode do WebView2 inválida: $($signature.Status)"
          }

      - name: Smoke test station package
        shell: pwsh
        run: |
          $pdfium = "agent\publish\runtimes\win-x64\native\pdfium.dll"
          if (-not (Test-Path $pdfium)) { throw "Biblioteca PDFium ausente: $pdfium" }
          & agent\publish\FarmaFlowAgent.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Smoke test da estação falhou." }

      - name: Compile installers
        shell: pwsh
        run: |
          Push-Location agent
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\FarmaFlowAgent.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilação do instalador da estação falhou." }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\FarmaFlowServer.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilação do instalador do servidor falhou." }
          Pop-Location

      - name: Sign Windows installers
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            Write-Host "Certificado Authenticode não configurado; assinatura opcional ignorada."
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "farmaflow-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) { throw "signtool.exe x64 não encontrado." }

            foreach ($installer in Get-ChildItem agent\artifacts\FarmaFlow-*-Setup.exe) {
              & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
                /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Assinatura falhou: $($installer.Name)" }
            }
          }
          finally {
            if (Test-Path $certificatePath) { Remove-Item $certificatePath -Force }
          }

      - name: Create release manifest and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path agent\publish-migration\docs | Out-Null
          Copy-Item agent\docs\GUIA-INSTALACAO-COMPLETA.md agent\publish-migration\docs\GUIA-INSTALACAO-COMPLETA.md
          Copy-Item agent\scripts\Test-LocalDeployment.ps1 agent\publish-migration\Test-LocalDeployment.ps1
          Copy-Item backend\ops\local\CUTOVER.md agent\publish-migration\docs\CUTOVER.md
          Copy-Item backend\ops\supabase\harden_data_api.sql agent\publish-migration\harden_data_api.sql
          Copy-Item backend\ops\supabase\verify_data_api_security.sql agent\publish-migration\verify_data_api_security.sql
          Compress-Archive agent\publish-migration\* agent\artifacts\FarmaFlow-Migration.zip -Force
          $releaseFiles = @(
            "agent\artifacts\FarmaFlow-Server-Setup.exe",
            "agent\artifacts\FarmaFlow-Estacao-Setup.exe",
            "agent\artifacts\FarmaFlow-Migration.zip"
          )
          foreach ($file in $releaseFiles) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Artefato ausente: $file" }
          }

          $manifest = [ordered]@{
            product = "FarmaFlow Local"
            version = "${{ steps.version.outputs.value }}"
            createdAt = [DateTimeOffset]::UtcNow.ToString("O")
            source = [ordered]@{
              agentRepository = "${{ github.repository }}"
              agentCommit = (git -C agent rev-parse HEAD).Trim()
              backendRepository = "pablodixs/farmaflow.backend"
              backendCommit = (git -C backend rev-parse HEAD).Trim()
              webRepository = "pablodixs/farmaflow"
              webCommit = (git -C web rev-parse HEAD).Trim()
            }
            runtimes = [ordered]@{
              java = (& runtime-input\java\bin\java.exe -version 2>&1 | Select-Object -First 1).ToString()
              node = (& runtime-input\node\node.exe --version).Trim()
              postgres = (& runtime-input\postgres\bin\postgres.exe --version).Trim()
              postgresArchiveSha256 = $env:POSTGRES_SHA256
            }
            files = @($releaseFiles | ForEach-Object {
              $item = Get-Item $_
              [ordered]@{
                name = $item.Name
                size = $item.Length
                sha256 = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            })
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content agent\artifacts\release-manifest.json -Encoding UTF8

          $checksumFiles = $releaseFiles + "agent\artifacts\release-manifest.json"
          $lines = foreach ($file in $checksumFiles) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content agent\artifacts\SHA256SUMS.txt -Encoding ascii

      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: |
            agent/artifacts/FarmaFlow-Server-Setup.exe
            agent/artifacts/FarmaFlow-Estacao-Setup.exe
            agent/artifacts/FarmaFlow-Migration.zip
            agent/artifacts/release-manifest.json

      - name: Upload installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: FarmaFlow-Windows-${{ steps.version.outputs.value }}
          path: agent/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            agent/artifacts/FarmaFlow-Server-Setup.exe
            agent/artifacts/FarmaFlow-Estacao-Setup.exe
            agent/artifacts/FarmaFlow-Migration.zip
            agent/artifacts/release-manifest.json
            agent/artifacts/SHA256SUMS.txt
